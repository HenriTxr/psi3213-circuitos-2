# PSI3213 Circuitos Elétricos II — material de estudo para a P1

Material pessoal de estudo (Poli-USP, 2º sem. 2026), cobrindo os **blocos 1 a 4** do programa: transformada de Laplace, circuitos de 2ª ordem, análise nodal e de malhas em Laplace, estabilidade, funções de rede, impedâncias, superposição, Thévenin e Norton.

> **Como está organizado.** O **glossário** é teoria de consulta, na ordem das Listas, com as equações citando onde foram conferidas. Os **exercícios** são resoluções passo a passo; **cada um se sustenta sozinho** — reescreve toda fórmula que usa e não depende de nenhum outro. A ordem de leitura é livre: escolha pelo assunto no índice.

> ⚠️ Fonte canônica: Listas 01, 03 e 04 da disciplina e as provas P1 2022-2025 e testinhos 2025. Não é material oficial.

<script>
function protege(md){
  const m=[];
  md=md.replace(/\$\$[\s\S]+?\$\$/g,s=>{m.push(s);return '@@M'+(m.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^$\n]+?)\$/g,(s,a,b)=>{m.push('$'+b+'$');
    return a+'@@M'+(m.length-1)+'@@';});
  return [md,m];
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;');}
document.querySelectorAll('script[type="text/markdown"]').forEach(sc=>{
  const [md,m]=protege(sc.textContent);
  let h=marked.parse(md);
  h=h.replace(/@@M(\d+)@@/g,(s,i)=>esc(m[+i]));
  const d=document.createElement('div');d.innerHTML=h;
  d.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');
    w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t);});
  const sid=sc.parentNode.id;let k=0;
  d.querySelectorAll('h2').forEach(h2=>{h2.id=sid+'-'+(k++);});
  sc.parentNode.replaceChild(d,sc);
});
renderMathInElement(document.body,{delimiters:[
  {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
  throwOnError:false});
const side=document.getElementById('side');
document.getElementById('menu').onclick=()=>side.classList.toggle('aberto');
side.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=()=>
  side.classList.remove('aberto'));
const busca=document.getElementById('busca');
if(busca){busca.oninput=()=>{
  const q=busca.value.normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().trim();
  side.querySelectorAll('a.g,a.s').forEach(a=>{
    const t=a.textContent.normalize('NFD').replace(/[̀-ͯ]/g,'')
      .toLowerCase();
    a.classList.toggle('oculto',q&&!t.includes(q));});
  side.querySelectorAll('div.g').forEach(g=>{
    let n=g.nextElementSibling,vis=false;
    while(n&&!n.classList.contains('g')){if(!n.classList.contains('oculto'))
      vis=true;n=n.nextElementSibling;}
    g.classList.toggle('oculto',q&&!vis);});
};}
const raiz=document.documentElement;
try{const t=localStorage.getItem('tema');if(t)raiz.dataset.theme=t;}catch(e){}
document.getElementById('tema').onclick=()=>{
  const escuro=raiz.dataset.theme?raiz.dataset.theme==='dark':
    matchMedia('(prefers-color-scheme: dark)').matches;
  raiz.dataset.theme=escuro?'light':'dark';
  try{localStorage.setItem('tema',raiz.dataset.theme);}catch(e){}
};
if(location.hash){const e=document.getElementById(location.hash.slice(1));
  if(e)e.scrollIntoView();}
</script>
