# PSI3213 Circuitos Elétricos II — material de estudo

Material pessoal de estudo (Poli-USP, 2º sem. 2026), cobrindo os **blocos 1 a 5** do programa: transformada de Laplace, circuitos de 2ª ordem, análise nodal e de malhas em Laplace, estabilidade, funções de rede, impedâncias, superposição, Thévenin e Norton; e, para o testinho de FCPs, estabilidade e indutância mútua, as **trilhas** dos blocos 4 e 5 (mútua, convenção dos pontos, análise de malhas com mútua, transformador ideal) e as questões da Lista 05.

> **Trilha** = aprender resolvendo: a teoria entra no momento em que é usada, em exemplos de dificuldade crescente, com uma figura a cada vez que o circuito muda. **Leia em ordem.**

> **Como está organizado.** O **glossário** é teoria de consulta, na ordem das Listas, com as equações citando onde foram conferidas. Os **exercícios** são resoluções passo a passo; **cada um se sustenta sozinho** — reescreve toda fórmula que usa e não depende de nenhum outro. A ordem de leitura é livre: escolha pelo assunto no índice.

> ⚠️ Fonte canônica: Listas 01, 03, 04 e 05 da disciplina, as provas P1 2022-2025 e os testinhos 2025. Não é material oficial.

## Como usar o site

- **Marque como estudado** no topo de cada item: o progresso fica salvo neste navegador e aparece nos cartões acima.
- No índice, filtre por **estado**, **bloco** ou **origem** (Lista × provas).
- Toque numa figura para ampliar; use **← →** no fim de cada item para seguir.

## Roteiro de uso sugerido

1. Leia a seção do glossário do assunto (é curta).
2. Faça um exercício da Lista daquele assunto **sem olhar**; depois compare passo a passo.
3. Feche com as questões de prova do mesmo assunto.
4. Antes da prova, refaça só os **Roteiros para repetir** do fim de cada exercício.

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
function protege(md){
  const m=[];
  md=md.replace(/\$\$[\s\S]+?\$\$/g,s=>{m.push(s);return '@@M'+(m.length-1)+'@@';});
  md=md.replace(/(^|[^\\$])\$([^$\n]+?)\$/g,(s,a,b)=>{m.push('$'+b+'$');
    return a+'@@M'+(m.length-1)+'@@';});
  return [md,m];
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;');}
document.querySelectorAll('script[type="text/markdown"]').forEach(sc=>{
  const [md,m]=protege(sc.textContent);
  let h=marked.parse(md);
  h=h.replace(/@@M(\d+)@@/g,(s,i)=>esc(m[+i]));
  const d=document.createElement('div');d.innerHTML=h;
  d.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');
    w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t);});
  d.querySelectorAll('blockquote').forEach(b=>{const t=b.textContent.trim();
    if(t.startsWith('⚠'))b.classList.add('warn');
    else if(t.startsWith('💡'))b.classList.add('dica');});
  /* ---- blocos ```derivacao: historico de calculo da equacao acima ---- */
  d.querySelectorAll('pre > code').forEach(cd=>{
    if(!/language-derivacao/.test(cd.className||''))return;
    const pre=cd.parentNode, alvo=pre.previousElementSibling;
    const partes=cd.textContent.split(/^\s*---\s*$/m);
    let tit='',corpo='',n=0;
    partes.forEach(p=>{
      let ls=p.split('\n').map(l=>l.trim()).filter(l=>l);
      if(ls.length&&/^t[ií]tulo:/i.test(ls[0]))
        tit=ls.shift().replace(/^t[ií]tulo:/i,'').trim();
      if(!ls.length)return;
      const mat=ls.filter(l=>l.startsWith('$$')).join(' ');
      const por=ls.filter(l=>!l.startsWith('$$')).join(' ');
      n++;
      corpo+='<div class="dpasso"><div class="dn">'+n+'</div><div>'+
        (por?'<p class="por">'+esc(por)+'</p>':'')+
        (mat?'<div class="mat">'+esc(mat)+'</div>':'')+'</div></div>';
    });
    const box=document.createElement('div');
    box.className='derivbox oculto';
    box.dataset.tit=tit;box.innerHTML=corpo;
    pre.parentNode.replaceChild(box,pre);
    if(alvo){
      alvo.classList.add('comderiv');
      const tag=document.createElement('span');
      tag.className='derivtag';
      tag.textContent='▸ ver todos os passos até aqui';
      alvo.appendChild(tag);
    }
  });
  const sid=sc.parentNode.id;let k=0;
  d.querySelectorAll('h2').forEach(h2=>{h2.id=sid+'-'+(k++);});
  let k3=0;d.querySelectorAll('h3').forEach(h3=>{h3.id=sid+'-h'+(k3++);});
  sc.parentNode.replaceChild(d,sc);
});
/* \dest{} \novo{} \cai{}: marcam termos dentro das formulas, com cor que
   respeita o tema (ver CSS .kdest/.knovo/.kcai) */
const KMACROS={'\\dest':'\\htmlClass{kdest}{#1}',
  '\\novo':'\\htmlClass{knovo}{#1}','\\cai':'\\htmlClass{kcai}{#1}'};
const KTRUST=c=>c.command==='\\htmlClass';
renderMathInElement(document.body,{delimiters:[
  {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
  macros:KMACROS,trust:KTRUST,strict:false,throwOnError:false});

/* ---- modal das derivacoes ---- */
(function(){
  const alvos=[...document.querySelectorAll('.comderiv')];
  if(!alvos.length)return;
  const dv=document.createElement('div');dv.id='dv';
  dv.innerHTML='<div id="dvp"><div id="dvh"><b id="dvt"></b>'+
    '<span>todos os passos, do início até esta equação</span>'+
    '<button id="dvx">fechar</button></div><div id="dvc"></div></div>';
  document.body.append(dv);
  const dvc=document.getElementById('dvc'), dvt=document.getElementById('dvt');
  alvos.forEach((el,i)=>{
    const sec=el.closest('section');
    el.id='deriv-'+((sec&&sec.id)||'p')+'-'+i;
    el.onclick=()=>abre(el);
  });
  function abre(el){
    const box=el.nextElementSibling;
    if(!box||!box.classList.contains('derivbox'))return;
    dvt.innerHTML=esc(box.dataset.tit||'Passo a passo');
    try{renderMathInElement(dvt,{delimiters:[
      {left:'$$',right:'$$',display:false},
      {left:'$',right:'$',display:false}],macros:KMACROS,trust:KTRUST,
      strict:false,throwOnError:false});}catch(e){}
    dvc.innerHTML=box.innerHTML;
    const ps=dvc.querySelectorAll('.dpasso');
    if(ps.length)ps[ps.length-1].classList.add('alvo');
    if(dvc.querySelector('.kdest,.knovo,.kcai')){
      const lg=document.createElement('p');lg.className='legm';
      lg.innerHTML='cores nas fórmulas: <b class="a">termo em foco</b> · '+
        '<b class="b">o que ele virou</b> · <b class="c">o que cancela</b>';
      dvc.insertBefore(lg,dvc.firstChild);
    }
    dv.classList.add('on');
    document.body.style.overflow='hidden';
    if(history.replaceState)history.replaceState(null,'','#'+el.id);
  }
  function fecha(){dv.classList.remove('on');document.body.style.overflow='';}
  dv.addEventListener('click',e=>{if(e.target===dv)fecha();});
  document.getElementById('dvx').onclick=fecha;
  addEventListener('keydown',e=>{if(e.key==='Escape')fecha();});
  if(location.hash.startsWith('#deriv-')){
    const el=document.getElementById(location.hash.slice(1));
    if(el){el.scrollIntoView({block:'center'});abre(el);}
  }
})();
const side=document.getElementById('side');
document.getElementById('menu').onclick=()=>side.classList.toggle('aberto');
side.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=()=>
  side.classList.remove('aberto'));
const busca=document.getElementById('busca');
const PAG=document.body.dataset.pag;
const main=document.querySelector('main');
const secoes=[...main.querySelectorAll(':scope > section')];
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'')
  .toLowerCase().trim();}
let feitos={};
try{feitos=JSON.parse(localStorage.getItem('feitos')||'{}');}catch(e){}
function salva(){try{localStorage.setItem('feitos',JSON.stringify(feitos));}
  catch(e){}}
const alvoDe=a=>document.getElementById(a.getAttribute('href').slice(1));
const secDe=a=>{const e=alvoDe(a);const s=e&&e.closest('section');
  return s?s.id:null;};
const links=[...side.querySelectorAll('a.g,a.s')]
  .filter(a=>a.getAttribute('href').startsWith('#')&&alvoDe(a));
const secLink={};
links.forEach(a=>{const e=alvoDe(a);if(e.tagName==='SECTION')secLink[e.id]=a;});
function grupoDe(a){let n=a.previousElementSibling;
  while(n&&!(n.tagName==='DIV'&&n.classList.contains('g')))
    n=n.previousElementSibling;
  return n?n.textContent:'';}

/* ---- filtros: busca + estado + bloco + origem ---- */
const F={st:'',b:'',o:''};
function aplica(){
  const q=busca?norm(busca.value):'';
  links.forEach(a=>{
    const id=secDe(a),t=norm(a.textContent),m=id&&id.match(/^[egt]-(\d\d)/);
    let ok=!q||t.includes(q);
    if(F.b&&(!m||m[1]!==F.b))ok=false;
    if(F.st==='feito'&&!feitos[id])ok=false;
    if(F.st==='pend'&&feitos[id])ok=false;
    if(F.o&&(F.o==='P')!==grupoDe(a).includes('Provas'))ok=false;
    a.classList.toggle('oculto',!ok);});
  side.querySelectorAll('div.g').forEach(g=>{
    let n=g.nextElementSibling,vis=false;
    while(n&&!(n.tagName==='DIV'&&n.classList.contains('g'))){
      if(n.tagName==='A'&&!n.classList.contains('oculto'))vis=true;
      n=n.nextElementSibling;}
    g.classList.toggle('oculto',!vis&&!!(q||F.b||F.st||F.o));});
  const filtrando=F.b||F.st||F.o;
  secoes.forEach(s=>{const a=secLink[s.id];
    s.classList.toggle('oculto',!!(filtrando&&a&&a.classList.contains('oculto')));});
  pager();
}
if(busca)busca.oninput=aplica;
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  const k=c.dataset.k,v=c.dataset.v;F[k]=F[k]===v?'':v;
  document.querySelectorAll('.chip[data-k="'+k+'"]').forEach(x=>
    x.classList.toggle('on',x.dataset.v===F[k]));aplica();});

/* ---- marcar como estudado ---- */
function marca(id){
  const a=secLink[id];if(a)a.classList.toggle('ok',!!feitos[id]);
  const b=document.querySelector('#'+CSS.escape(id)+' .feito');
  if(b){b.classList.toggle('on',!!feitos[id]);
    b.textContent=feitos[id]?'✓ estudado':'marcar como estudado';}
}
if(PAG!=='index.html'){
  secoes.forEach(s=>{
    const h=s.querySelector('h1');if(!h)return;
    const b=document.createElement('button');b.type='button';b.className='feito';
    b.onclick=()=>{if(feitos[s.id])delete feitos[s.id];else feitos[s.id]=1;
      salva();marca(s.id);aplica();};
    h.after(b);marca(s.id);});
}

/* ---- anterior / proximo ---- */
function pager(){
  main.querySelectorAll('.pn').forEach(p=>p.remove());
  if(PAG==='index.html')return;
  const vis=secoes.filter(s=>!s.classList.contains('oculto'));
  vis.forEach((s,i)=>{
    const p=document.createElement('div');p.className='pn';
    const mk=(alvo,rot,cl)=>{const a=document.createElement('a');
      a.href='#'+alvo.id;a.className=cl;
      const l=secLink[alvo.id];
      a.textContent=rot+(l?' '+l.textContent.replace(/ ✓$/,''):'');
      a.onclick=e=>{e.preventDefault();history.replaceState(null,'','#'+alvo.id);
        alvo.scrollIntoView();};return a;};
    p.append(i>0?mk(vis[i-1],'←','e'):document.createElement('span'));
    if(i<vis.length-1)p.append(mk(vis[i+1],'→','d'));
    p.firstChild.tagName==='SPAN'&&(p.firstChild.style.flex='1');
    s.append(p);});
}

/* ---- rolagem destacada, barra de leitura, ultimo ponto ---- */
const porId={};
links.forEach(a=>porId[a.getAttribute('href').slice(1)]=a);
const alvos=[...main.querySelectorAll('section,h2,h3')].filter(e=>porId[e.id]);
const barra=document.getElementById('prog');
let atual=null,tick=false;
function espia(){
  tick=false;
  const h=document.documentElement;
  barra.style.width=(100*scrollY/Math.max(1,h.scrollHeight-innerHeight))+'%';
  let best=null;
  for(const e of alvos){if(e.offsetParent===null)continue;
    if(e.getBoundingClientRect().top<=120)best=e;else break;}
  if(!best||best===atual)return;
  atual=best;
  side.querySelectorAll('a.cur').forEach(x=>x.classList.remove('cur'));
  const a=porId[best.id];a.classList.add('cur');
  const sr=side.getBoundingClientRect(),ar=a.getBoundingClientRect();
  if(ar.top<sr.top+40||ar.bottom>sr.bottom-20)
    side.scrollTop+=ar.top-sr.top-sr.height/3;
  try{localStorage.setItem('ultimo',JSON.stringify(
    {u:PAG+'#'+best.id,r:a.textContent.replace(/ ✓$/,'')}));}catch(e){}
}
if(PAG!=='index.html'){
  addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(espia);}},
    {passive:true});
}

/* ---- capa: progresso e continuar ---- */
document.querySelectorAll('.cap a.c[data-pref]').forEach(c=>{
  const tot=+c.dataset.tot,n=Object.keys(feitos).filter(k=>
    k.startsWith(c.dataset.pref)).length;
  c.querySelector('.barra i').style.width=(100*n/Math.max(1,tot))+'%';
  c.querySelector('.n').textContent=n+' de '+tot+' estudados';});
const cont=document.getElementById('cont');
if(cont){try{const u=JSON.parse(localStorage.getItem('ultimo')||'null');
  if(u){cont.style.display='block';const a=cont.querySelector('a');
    a.href=u.u;a.textContent=u.r;}}catch(e){}}

/* ---- zoom nas figuras ---- */
const lb=document.createElement('div');lb.id='lb';
lb.innerHTML='<img alt="">';document.body.append(lb);
main.addEventListener('click',e=>{if(e.target.tagName==='IMG'){
  lb.firstChild.src=e.target.src;lb.classList.add('on');}});
lb.onclick=()=>lb.classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on');});

aplica();
const raiz=document.documentElement;
try{const t=localStorage.getItem('tema');if(t)raiz.dataset.theme=t;}catch(e){}
document.getElementById('tema').onclick=()=>{
  const escuro=raiz.dataset.theme?raiz.dataset.theme==='dark':
    matchMedia('(prefers-color-scheme: dark)').matches;
  raiz.dataset.theme=escuro?'light':'dark';
  try{localStorage.setItem('tema',raiz.dataset.theme);}catch(e){}
};
if(location.hash){const e=document.getElementById(location.hash.slice(1));
  if(e)e.scrollIntoView();}
</script>
